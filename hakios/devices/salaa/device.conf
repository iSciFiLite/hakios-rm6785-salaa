# Realme 7 (RMX2151), codename SALAA.

device salaa
	title       Realme 7 (RMX2151, SALAA)
	vendor      realme
	soc         mt6785
	defconfig   salaa_defconfig
	maintainer  HakiOS MT6785 port contributors
	status      display     works     SALAA SimpleFb GOP verified (1080x2400, Stride 1088, Tianma NT36672C @ 0x75d30000, length 0x02cd0000)
	status      cpu         works     MT6785 6+2 MPIDR affinity (6x A55 @ 1.7 GHz + 2x A76 @ 2.17 GHz); boot core 7, PSCI via SMC conduit
	status      storage     partial   MT6785 UFSHCI at 0x11270000 (UFS 2.1 Gear 3, Samsung KM8V8001JM-B813, LUNs 0/1); UFS Block I/O probe verified
	status      touch       partial   SALAA stock DT identifies Novatek NF NT36672C over SPI3 (spi@1100f000, RST GPIO158, INT GPIO8)
	status      buttons     partial   MediaTek MT6359 PMIC power key, Vol Up (GPIO 2), Vol Down
	status      usb         partial   Generic UEFI USB class stack; MT6785 SSUSB/xHCI controller mapped
	status      gpu         partial   Mali-G76 MC4 Bifrost at 0x13040000, MFG clock/power at 0x13fbf000
	status      battery     partial   MT6359 fuel gauge and charging status query via UEFI charger protocol
	status      audio       missing   no MT6785 audio path
	status      wifi        missing   MT6785 CONNSYS, firmware and network stack are not ported
	status      bluetooth   missing   MT6785 CONNSYS, firmware and transport are not ported
	status      camera      missing   no camera path
	status      haptic      missing   no haptic path
	status      thermal     missing   no MT6785 thermal path
