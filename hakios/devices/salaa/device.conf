# Realme 7 (RMX2151), codename SALAA.

device salaa
	title       Realme 7 (RMX2151, SALAA)
	vendor      realme
	soc         mt6785
	defconfig   salaa_defconfig
	maintainer  HakiOS MT6785 port contributors
	status      display     partial   SALAA stock DT describes 1080x2400 Truly DSI; XNULOADER consumes UEFI GOP but device firmware GOP is unavailable/unverified
	status      touch       partial   SALAA stock DT identifies Novatek NF NT36672C over SPI3; no HakiOS NVT protocol driver yet
	status      buttons     missing   MTK PMIC/key input path not ported for this board
	status      cpu         partial   MT6785 6+2 MPIDR map is in the XNULOADER profile; 7 CPUs requested, PSCI startup unverified
	status      gpu         missing   Mali-G76 MC4 is identified; MT6768 G52 power/clock sequence is not reused
	status      storage     partial   MT6785 UFSHCI base and read-only UEFI block path are configured; SALAA firmware lacks validated UFS Block I/O
	status      audio       missing   no MT6785 audio path
	status      battery     missing   no MT6785 PMIC/battery path
	status      wifi        missing   MT6785 CONNSYS, firmware and network stack are not ported
	status      bluetooth   missing   MT6785 CONNSYS, firmware and transport are not ported
	status      camera      missing   no camera path
	status      haptic      missing   no haptic path
	status      thermal     missing   no MT6785 thermal path
